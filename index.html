<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Yaris Care</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="eyebrow">2011 TOYOTA YARIS · HATCH</div>
    <h1>Good morning,<br><span>Your Yaris is ready.</span></h1>
    <div class="hero-card">
      <div class="ring" id="ring"><strong id="score">0%</strong><small>MONTHLY</small></div>
      <div><p class="muted">Next review</p><h2 id="nextReview">Last Saturday</h2><button id="resetMonth">Start new month</button></div>
    </div>
  </header>

  <main>
    <section class="quick-grid">
      <button class="quick" data-action="odometer"><span>ODO</span><strong id="odo">285,915</strong><small>km</small></button>
      <button class="quick" data-action="fuel"><span>FUEL</span><strong id="fuel">—</strong><small>tap to log</small></button>
      <button class="quick" data-action="note"><span>NOTE</span><strong>＋</strong><small>add reminder</small></button>
    </section>

    <section>
      <div class="section-head"><div><p class="eyebrow">THIS MONTH</p><h2>Owner checks</h2></div><span id="count">0 / 9</span></div>
      <div id="checklist" class="checklist"></div>
    </section>

    <section>
      <div class="section-head"><div><p class="eyebrow">SERVICE BOOK</p><h2>Recent records</h2></div><button class="text-btn" id="addService">+ Add</button></div>
      <div id="services" class="records"></div>
    </section>

    <section class="trip-card">
      <p class="eyebrow">BEFORE A LONG DRIVE</p><h2>Five-minute safety check</h2>
      <p>Tyres, oil, coolant, lights, fuel and your roadside kit.</p>
      <button id="tripCheck">Open checklist →</button>
    </section>
  </main>

  <nav><button class="active">⌂<small>Home</small></button><button id="navChecks">✓<small>Checks</small></button><button id="navRecords">▤<small>Records</small></button></nav>
  <dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" id="modalSave">Save</button></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
