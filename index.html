<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#102a72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Yaris Care</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260830-17">
  <link rel="stylesheet" href="styles.css?v=20260830-17">
  <link rel="stylesheet" href="fuel.css?v=20260830-17">
</head>
<body>
  <header>
    <div class="eyebrow">2011 TOYOTA YARIS · HATCH · 042VRY</div>
    <h1>Tara!<br><span>Your Yaris is ready.</span></h1>
  </header>

  <main>
    <section class="quick-grid">
      <button class="quick" data-action="odometer"><span>ODO</span><strong id="odo">285,915</strong><small>km</small></button>
      <button class="quick" data-action="fuel"><span>LAST REFUEL</span><strong id="fuel">—</strong><small>tap to view</small></button>
      <button class="quick" data-action="note"><span>NOTE</span><strong>＋</strong><small>add reminder</small></button>
    </section>

    <section class="trip-card" id="tripCard">
      <div id="tripBody">
        <p class="eyebrow">BEFORE A LONG DRIVE</p><h2>Five-minute safety check</h2>
        <p>Tyres, oil, water levels, lights, fuel and your roadside kit.</p>
        <button id="tripCheck">Open checklist →</button>
      </div>
    </section>

    <section class="fuel-card">
      <div class="section-head fuel-head"><div><p class="eyebrow">FUEL LOG</p><h2>Last refuel</h2></div><button class="text-btn" id="editFuel">Edit</button></div>
      <div class="fuel-details" id="fuelDetails"></div>
    </section>

    <section id="checksSection">
      <div class="section-head"><div><p class="eyebrow">THIS MONTH</p><h2>Owner checks</h2></div><span id="count">0 / 9</span></div>
      <div id="checklist" class="checklist"></div>
    </section>

    <section>
      <div class="section-head"><div><p class="eyebrow">SERVICE BOOK</p><h2>Recent records</h2></div><button class="text-btn" id="addService">+ Add</button></div>
      <div id="services" class="records"></div>
    </section>

  </main>

  <nav><button class="active" id="navHome">⌂<small>Home</small></button><button id="navChecks">✓<small>Checks</small></button><button id="navRecords">▤<small>Records</small></button><button id="navCar" aria-label="Edit car information"><span class="plate-icon" aria-hidden="true">VIC</span><small>Car</small></button></nav>
  <dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button value="cancel">Cancel</button><button value="save" id="modalSave">Save</button></div></form></dialog>
  <script src="app.js?v=20260830-17"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', async () => {
        const registration = await navigator.serviceWorker.register('./sw.js?v=20260830-17');
        registration.update();
      });
    }
  </script>
</body>
</html>
